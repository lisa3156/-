<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>周边库存管理表</title>
    <meta name="description" content="全方位的周边商品库存管理系统，支持自动补全、批量操作、销售追踪、动态统计及 Excel 导出功能。" />
    <meta property="og:title" content="周边库存管理表" />
    <meta property="og:description" content="全方位的周边商品库存管理系统，支持自动补全、批量操作、销售追踪、动态统计及 Excel 导出功能。" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                mochaGrey: '#AC9B95',     // 灰调浅灰褐色（浅摩卡灰 - 浅边框、分割线、手柄）
                mediumWarm: '#9B8072',    // 中度暖棕（灰褐色 - 次级文字、徽章轮廓、辅助按钮）
                terracotta: '#8D4429',    // 红棕 / 陶土棕（主行动按钮、关键重点、主交互）
                chocolate: '#5F3E32',     // 深巧克力棕（顶部导航背景、标题深色锚点、重点卡片）
                warmOrange: '#BB754B',    // 暖橘棕 / 土橘色（售出高亮、待结算提示、暖色徽章）
                text: '#3A2923',          // 主文本（深暖咖啡色）
                muted: '#8C776D',         // 次要文本与图标
                bg: '#FAF7F5',            // 页面温润暖灰底色
                card: '#FFFFFF'           // 卡片背景
              }
            }
          }
        }
      }
    </script>
    <!-- SheetJS for Excel Export -->
    <script src="https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { font-family: 'Inter', sans-serif; }
    </style>

    "react/": "https://aistudiocdn.com/react@^19.2.1/",
    "react": "https://aistudiocdn.com/react@^19.2.1"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>

</html>
